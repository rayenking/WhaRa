<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhaRa Update</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 13px;
      --ink: #18201c;
      --muted: #647169;
      --card: #f3f6f3;
      --edge: #dee4df;
      --green: #22b56a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #eff5f2;
        --muted: #9dacaa;
        --card: #252c2a;
        --edge: #343f39;
        --green: #39cb87;
      }
    }
    * { box-sizing: border-box; }
    body { background: transparent; color: var(--ink); margin: 0; padding: 21px 23px 18px; user-select: none; }
    .top { display: flex; align-items: center; gap: 12px; }
    .mark { width: 43px; height: 43px; border-radius: 12px; display: grid; place-items: center;
      color: #d6ffe9; background: #176742; font-size: 20px; font-weight: 750; flex: none; }
    h1 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .box { margin: 17px 0 13px; border: 1px solid var(--edge); background: var(--card);
      border-radius: 11px; padding: 12px 13px; min-height: 62px; }
    .box strong { font-weight: 600; font-size: 12px; }
    .notes { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      overflow: hidden; margin-top: 5px; color: var(--muted); font-size: 11.5px; line-height: 1.4;
      white-space: pre-wrap; }
    .progress-area { height: 34px; }
    progress { width: 100%; height: 7px; accent-color: var(--green); margin-top: 8px; }
    .status { color: var(--muted); font-size: 11.5px; }
    .buttons { display: flex; justify-content: flex-end; gap: 9px; margin-top: 2px; }
    button { cursor: pointer; border: 1px solid var(--edge); border-radius: 9px; padding: 8px 18px;
      background: var(--card); color: var(--ink); font: inherit; font-weight: 600; min-width: 78px; }
    button.primary { background: var(--green); border-color: var(--green); color: #082519; }
    button:disabled { cursor: default; opacity: .5; }
    button:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="top">
    <div class="mark" aria-hidden="true">W</div>
    <div>
      <h1>WhaRa update available</h1>
      <div class="subtitle" id="version">Checking version…</div>
    </div>
  </div>
  <div class="box">
    <strong>What's new</strong>
    <div class="notes" id="notes">A new version of WhaRa is ready to install.</div>
  </div>
  <div class="progress-area">
    <div class="status" id="status">Your chats and preferences stay in WhaRa.</div>
    <progress id="progress" max="100" value="0" hidden></progress>
  </div>
  <div class="buttons">
    <button id="later">Later</button>
    <button id="install" class="primary">Update</button>
  </div>
  <script>
    const invoke = (cmd, args) => globalThis.__TAURI__.core.invoke(cmd, args);
    const el = (id) => document.getElementById(id);
    let busy = false;
    let downloaded = 0;

    function render(info) {
      if (!info) return;
      if (info.latest) el("version").textContent = `Version ${info.current} → ${info.latest}`;
      el("notes").textContent = info.notes?.trim() || "Bug fixes and improvements to WhaRa.";
      if (info.error) el("status").textContent = info.error;
      if (info.installing) {
        busy = true;
        el("install").disabled = true;
        el("later").disabled = true;
      }
    }

    function progress(event) {
      const { phase, downloaded: totalDownloaded, total } = event.payload || {};
      if (phase === "checking") {
        el("status").textContent = "Verifying release…";
      } else if (phase === "downloading") {
        downloaded = totalDownloaded || 0;
        if (total) {
          const percent = Math.min(100, Math.round((downloaded / total) * 100));
          el("progress").hidden = false;
          el("progress").value = percent;
          el("status").textContent = `Downloading update… ${percent}%`;
        } else {
          el("status").textContent = `Downloading update… ${(downloaded / 1048576).toFixed(1)} MB`;
        }
      } else if (phase === "installing") {
        el("progress").hidden = false;
        el("progress").removeAttribute("value");
        el("status").textContent = "Installing verified update…";
      } else if (phase === "restarting") {
        el("status").textContent = "Update installed. Restarting WhaRa…";
      }
    }

    el("later").addEventListener("click", async () => {
      if (busy) return;
      el("later").disabled = true;
      try {
        await invoke("updater_later");
      } catch (error) {
        el("status").textContent = String(error);
        el("later").disabled = false;
      }
    });

    el("install").addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      el("install").disabled = true;
      el("later").disabled = true;
      el("install").textContent = "Updating…";
      try {
        await invoke("updater_install");
      } catch (error) {
        busy = false;
        el("status").textContent = String(error);
        el("install").disabled = false;
        el("later").disabled = false;
        el("install").textContent = "Retry";
      }
    });

    globalThis.__TAURI__.event.listen("updater-progress", progress);
    globalThis.__TAURI__.event.listen("updater-state", (event) => render(event.payload));
    invoke("updater_state").then(render).catch((err) => {
      el("status").textContent = String(err);
      el("install").disabled = true;
    });
  </script>
</body>
</html>
