[package]
name = "whara"
version = "0.1.0"
description = "WhaRa - WhatsApp Web as a native macOS client"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[lib]
name = "whara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tauri-plugin-notification = "2.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Reads the running macOS version so the Safari user agent matches the engine.
objc2-foundation = { version = "0.3", features = ["NSProcessInfo"] }

tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
