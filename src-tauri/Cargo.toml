[package]
name = "whara"
version = "0.2.0"
description = "WhaRa - WhatsApp Web as a native macOS client"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "whara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Reads the running macOS version so the Safari user agent matches the engine.
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSError"] }

# Native WKWebView evaluation with a completion callback for the debug-only
# Unix-socket development bridge; no Web Inspector or page IPC required.
objc2-web-kit = { version = "0.3", features = ["WKWebView", "block2"] }
objc2 = "0.6"
block2 = "0.6"

tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
